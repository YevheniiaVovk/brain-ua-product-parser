version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: parser_postgres
    restart: always
    environment:
      POSTGRES_DB: parser_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: